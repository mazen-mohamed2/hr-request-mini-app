name: hr-request-mini-app
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hr_requests
      POSTGRES_USER: hr_dev
      POSTGRES_PASSWORD: hr_dev_password
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hr_dev -d hr_requests']
      interval: 2s
      timeout: 3s
      retries: 30
  postgres-test:
    image: postgres:17-alpine
    profiles: ['test']
    environment:
      POSTGRES_DB: hr_requests_test
      POSTGRES_USER: hr_test
      POSTGRES_PASSWORD: hr_test_password
    ports:
      - '127.0.0.1:55433:5432'
    # Test data is disposable and kept separate from the development database.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hr_test -d hr_requests_test']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
